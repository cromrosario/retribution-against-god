* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; }
body {
  position: relative;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none; user-select: none;
}
input { -webkit-user-select: text; user-select: text; }
body { overscroll-behavior: none; }
.log { -webkit-touch-callout: default; -webkit-user-select: text; user-select: text; }
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(50, 40, 140, 0.35), transparent 62%),
    linear-gradient(rgba(2, 3, 12, 0.88), rgba(2, 3, 12, 0.94)),
    var(--art, none) center top / cover no-repeat,
    #02030a;
}
button { font-family: inherit; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app {
  max-width: 480px; height: 100%; margin: 0 auto;
  padding: 8px 10px 8px;
  display: flex; flex-direction: column; gap: 6px; overflow: hidden;
}
/* ---- ウィンドウ(FFのメニュー風) ---- */
.stage, .me, .choices, .abilities, .log {
  background: linear-gradient(180deg, #1c2c97 0%, #0c1553 55%, #080e3d 100%);
  border: 2px solid var(--edge);
  border-radius: 8px;
  box-shadow: 0 0 0 1px #04051c, inset 0 0 0 1px rgba(120, 140, 255, 0.35), 0 4px 10px rgba(0, 0, 0, 0.55), 0 0 14px hsl(var(--zh) 70% 50% / 0.12);
}
.log { background: linear-gradient(180deg, rgba(8, 12, 54, 0.94), rgba(3, 5, 28, 0.96)); }
/* 上部 */
.topbar { display: grid; gap: 4px; flex: none; }
.tb-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 24px; }
.tb-row .floor { font-family: var(--font-title); font-size: 13px; color: var(--gold); text-shadow: 1px 1px 0 #04051c; letter-spacing: 0.04em; }
.tb-row .gold { color: var(--gold); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; text-shadow: 1px 1px 0 #04051c; }
.tb-right { display: flex; align-items: center; gap: 5px; margin-left: auto; }
.snd { background: linear-gradient(#1a2790, #0b1252); color: var(--ink); border: 2px solid var(--edge); border-radius: 6px; font-size: 11px; padding: 0 6px; line-height: 1.7; cursor: pointer; white-space: nowrap; }
.pips { display: flex; gap: 3px; }
.pip { flex: 1; height: 6px; background: #121a66; border: 1px solid #03041a; box-shadow: 0 0 0 1px rgba(150, 160, 240, 0.35); }
.pip.done { background: #98a2ea; }
.pip.here { background: var(--gold); box-shadow: 0 0 0 1px #fff, 0 0 6px var(--gold); }
.pip.boss { box-shadow: 0 0 0 1px var(--blood); }
/* 敵・場所 */
.stage {
  position: relative; flex: none;
  display: grid; grid-template-columns: 104px 1fr; gap: 12px; align-items: center;
  padding: 8px 10px; min-height: 124px;
}
.stage.hit { animation: jolt .18s linear; }
.stage.warn { border-color: #ff8a7a; box-shadow: 0 0 0 1px #5a0f0a, 0 0 14px rgba(255, 90, 70, 0.55); }
.me.hit { animation: jolt .18s linear; border-color: #ff8a7a; }
@keyframes jolt { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.sigil {
  aspect-ratio: 1 / 1; width: 100%;
  background: radial-gradient(circle at 50% 40%, #121d78, #04062a 75%);
  border: 2px solid #aab4ff; border-radius: 5px; box-shadow: inset 0 0 0 1px #04051c, 0 0 0 1px #04051c;
  padding: 3px; overflow: hidden;
}
.sigil svg, .sigil img { display: block; width: 100%; height: 100%; }
.sigil img { object-fit: contain; }
.sig { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.sig .fill { fill: var(--ink); stroke: none; }
.sig.strong { stroke: var(--blood); }
.sig.strong .fill { fill: var(--blood); }
.sig .frm { stroke: var(--line); stroke-width: 1; fill: none; }
.sig .f { fill: var(--ink); stroke: none; }
.sig .a { fill: var(--blood); stroke: none; }
.sig .as { stroke: var(--blood); fill: none; }
.sig .p { fill: #0a1146; stroke: none; }
.sig.art { stroke-width: 1.4; }
.dot { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
.dot .o { fill: var(--sp-o); } .dot .m { fill: var(--sp-m); } .dot .h { fill: var(--sp-h); } .dot .l { fill: var(--sp-l); } .dot .e { fill: var(--sp-e); } .dot .a { fill: var(--blood); }
.pc { image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }
.pc.ghost { filter: grayscale(1) contrast(.9) brightness(1.05); opacity: .7; transform: scaleX(-1); }
.stage-info { min-width: 0; display: grid; gap: 4px; }
.scene-name, .enemy-name { font-family: var(--font-title); font-size: 17px; line-height: 1.35; color: #fff; text-shadow: 1px 1px 0 #04051c; }
.scene-name.roman { font-family: var(--font-roman); font-weight: 700; font-size: 19px; letter-spacing: 0.04em; }
.scene-sub { font-size: 12px; color: var(--ink-soft); line-height: 1.55; }
.tags { font-size: 11px; color: var(--ink-soft); }
.tele { font-size: 12px; color: #ff9a8c; line-height: 1.45; animation: blink 1s steps(2) infinite; text-shadow: 1px 1px 0 #2a0503; }
/* ログ */
.log {
  flex: 1 1 0; min-height: 44px; overflow-y: auto; padding: 7px 10px;
  font-size: 14px; line-height: 1.65;
}
.log p { margin: 0 0 5px; }
.log .dice { color: #8f9ad8; font-size: 12.5px; }
.log .good { color: var(--good); }
.cmp { margin: 6px 0; padding: 6px 9px; border: 1px solid var(--line-soft); background: rgba(10, 17, 70, 0.6); font-size: 12.5px; line-height: 1.55; }
.cmp-h { color: var(--ink-soft); font-size: 12px; margin-bottom: 2px; }

  /* HP・MP・ダメージ・回復量は旧バージョンの100倍(2桁増)。内部では「基準値×U」で持つ */
  const U = 100;
  const sc = (n) => Math.round(n * U);
  const NF = (n) => Math.round(n).toLocaleString("en-US");
  /* スキルの説明文中のサイコロ表記(例 3d8+2)を、100倍した範囲の表記に直す */

    .replace(/MP\+(\d+)/g, (m, n) => "MP+" + NF(sc(+n)))
    .replace(/修正(?!×)/g, "修正×100");

  /* ================= データ ================= */

  const MAXZ = BOSS_FLOORS.length - 1;
  const MAXFLOOR = 1000;
  const zoneOf = (f) => { const i = BOSS_FLOORS.findIndex((b) => f <= b); return i < 0 ? MAXZ : i; };
  const isBossFloor = (f) => BOSS_FLOORS.indexOf(f) >= 0;

  const STN = { str: "筋力", dex: "敏捷", wis: "知識", skl: "器用さ" };
  function autoDesc(o) {
    const p = [];
    if (o.crits) p.push("必ず会心");
    if (o.strikes) p.push((o.hit ? "命中+" + o.hit + "、" : "") + (o.mult && o.mult !== 1 ? "ダメージ" + o.mult + "倍の" : "") + "攻撃を" + o.strikes + "回");
    if (o.dmg) p.push("必中 " + o.dmg[0] + "d" + o.dmg[1] + (o.dmg[2] ? "+" + o.dmg[2] : "") + (o.dmg[3] ? "+" + STN[o.dmg[3]] + "修正" : ""));
    if (o.leech) p.push("与えた分の" + Math.round(o.leech * 100) + "%を回復");
    if (o.heal) p.push("HPを " + o.heal[0] + "d" + o.heal[1] + (o.heal[2] ? "+" + o.heal[2] : "") + (o.heal[3] ? "+" + STN[o.heal[3]] + "修正" : "") + " 回復");
    if (o.fullHeal) p.push("HPを全回復");
    if (o.cure) p.push("毒と状態異常を消す");
    if (o.defdown) p.push("敵の防御-" + o.defdown);
    if (o.atb) p.push("ATBを" + o.atb + "%溜める");
    if (o.spGain) p.push("MP+" + o.spGain);
    if (o.shadow) p.push("次の敵の攻撃をかわす");
    (o.buffs || []).forEach((b) => p.push(b.sec + "秒間、" + b.n));
    (o.debuffs || []).forEach((b) => p.push("敵に" + b.sec + "秒間、" + b.n));
    return p.join("。");
  }

  function dotSVG(d, flip) {
    const by = {};
    d.rows.forEach((row, y) => {
      let x = 0;
      while (x < row.length) {
        const c = row[x];
        if (c === ".") { x++; continue; }
        let n = 1;
        while (x + n < row.length && row[x + n] === c) n++;
        (by[c] = by[c] || []).push("M" + (flip ? d.w - x - n : x) + " " + y + "h" + n + "v1h-" + n + "z");
        x += n;
      }
    });
    return '<svg class="dot" viewBox="0 0 ' + d.w + " " + d.h + '" aria-hidden="true">' + Object.keys(by).map((c) => '<path class="' + c + '" d="' + by[c].join("") + '"/>').join("") + "</svg>";
  }

  function enemyArt(e) {
    if (e.ghost) return playerImg("ghost");
    const d = e.boss ? DOTS["boss_" + e.key] : DOTS["arch_" + (ENEMY_ARCH[e.key] || "")];
    return d ? dotSVG(d, !e.boss && (hashStr(e.key) & 1) === 1) : null;
  }

      G.traits.forEach((t) => {
        const box = mkEl("div", "item");
        box.appendChild(mkEl("div", "iname", t.n));
        box.appendChild(mkEl("div", "idesc", TRAITS[t.key]));
        b.appendChild(box);
      });
      const nx = G.job.traits.find((x) => x[0] > G.lv);
      if (nx) b.appendChild(mkEl("p", "dim", "次:Lv " + nx[0] + "「" + nx[1] + "」"));
      const sum = {};
      gearList().forEach((it) => Object.keys(it.b || {}).forEach((k) => { sum[k] = (sum[k] || 0) + it.b[k]; }));
      const gt = bonText(sum);
      b.appendChild(mkEl("h4", "", "装備の効果(合計)"));
      b.appendChild(mkEl("p", gt ? "" : "dim", gt || "なし"));
      const ups = UPS.filter((u) => rec.up[u.k] > 0);
      if (ups.length) {
        b.appendChild(mkEl("h4", "", "憎悪による強化"));
        ups.forEach((u) => b.appendChild(kv(u.n, "+" + upv(u, rec.up[u.k]) + "(Lv " + rec.up[u.k] + ")")));
      }
    });
  });

  /* ================= タイトル・永続強化 ================= */
  function titleScreen() {
    G = null; enemy = null; inBattle = false; atbStop(); bgmMood = ""; syncBgm();
    $("#hud").hidden = true; $("#toolbar").hidden = true; $("#logBtn").hidden = true; $("#enemyBox").hidden = true;
    $("#floorLabel").hidden = false; $("#floorLabel").textContent = ""; $("#goldLabel").textContent = ""; $("#floorPips").hidden = false;
    document.body.className = "title";
    document.body.style.setProperty("--d", "0");
    document.documentElement.style.setProperty("--zh", ZONES[0].hue);
    preview = rollStats();
    showTitle();
    cloudPullAndRefresh();
  }
  function showTitle() {
    document.body.className = "title home";
    clearLog();
    const j = currentJob();
    const u = rec.up;
    const wrap = document.createElement("div");
    wrap.className = "title-stats";
    wrap.innerHTML =
      "<div><b>" + (preview.str + upEff("str") + j.str) + "</b><span>筋力</span></div>" +
      "<div><b>" + (preview.dex + upEff("dex") + j.dex) + "</b><span>敏捷</span></div>" +
      "<div><b>" + (preview.wis + upEff("wis") + j.wis) + "</b><span>知識</span></div><div><b>" + ((preview.skl == null ? 10 : preview.skl) + upEff("skl") + (j.skl || JOB_SKL[j.id] || 0)) + "</b><span>器用さ</span></div>";
    logEl.appendChild(wrap);
    log(j.n + "　" + j.desc, "dice");
    log("コンボ:" + j.combo.map((x) => x.n).join(" → "), "dice");
    log("LB:「" + j.lb.n + "」　ゲージ:" + JG[j.id].n, "dice");
    const saved = readRun();
    setChoices([
      ...(saved ? [{ label: "続きから", note: "第" + saved.g.floor + "層 " + (JOBS.find((x) => x.id === saved.g.job) || {}).n + " Lv" + saved.g.lv, fn: resumeRun }] : []),
      { label: saved ? "新しく旅立つ(いまの冒険は消える)" : "この能力値で旅立つ", alt: !!saved, fn: startRun },
      { label: "能力値を振り直す", alt: true, fn: () => { preview = rollStats(); showTitle(); } },
      { label: "職業を選ぶ", note: "いま:" + j.n, alt: true, fn: jobScreen },
      { label: "憎悪で永続強化する", note: "憎悪 " + rec.ash, alt: true, fn: metaScreen },
      { label: "パッシブツリーを見る", note: "全体像の確認", alt: true, fn: treeScreen },
      ...(ACC || WK || (window.claude && typeof window.claude.use === "function") ? [{ label: ACC ? "アカウント:" + ACC.id : "ログイン / 新規登録", note: acctNote(), alt: true, fn: acctScreen }] : [])
    ]);
    recordLine();
    drawStairsIdle();
    renderStage();
    logEl.scrollTop = 0;
  }
  function confirmSpend(what, cost, ok, cancel) {
    document.body.className = "title";
    clearLog();
    logHead("憎悪を消費します");
    log(what);
    log("憎悪 " + cost + " を消費する。(いま " + rec.ash + " → " + (rec.ash - cost) + ")", "dice");
    log("消費した憎悪は戻らない。取り消しも、振り直しもできない。", "bad");
    setChoices([
      { label: "憎悪を消費して決める", note: "憎悪 " + cost, fn: ok },
      { label: "やめる", alt: true, fn: cancel }
    ]);
    recordLine();
    renderStage();
  }
  function jobScreen() {
    document.body.className = "title menu";
    clearLog();
    log("どの職業で挑む? 憎悪 " + rec.ash + "。未解放の職業は、憎悪を消費して解放できる。");
    const list = JOBS.map((j) => {
      const un = isUnlocked(j);
      return {
        label: j.n + (j.id === currentJob().id ? "(選択中)" : ""),
        note: j.desc + (un ? "" : "【未解放:憎悪 " + j.cost + "】"),
        alt: true, disabled: !un && rec.ash < j.cost,
        fn: () => {
          if (un) { jobId = j.id; showTitle(); return; }
          confirmSpend("職業「" + j.n + "」を解放する。" + j.desc, j.cost, () => { rec.ash -= j.cost; rec.unlocked.push(j.id); saveRec(); jobId = j.id; showTitle(); }, jobScreen);
        }
      };
    });
    list.push({ label: "戻る", fn: showTitle });
    setChoices(list);
    recordLine();
  }
  function metaScreen() {
    document.body.className = "title menu";
    clearLog();
    log("憎悪 " + rec.ash + "。注ぎ込めば、次からの挑戦が永続的に強くなる。使った分は戻らない。(各Lv100まで)");
    const list = UPS.map((u) => {
      const lv = rec.up[u.k], max = lv >= UPMAX, cost = upCost(u, lv);
      return {
        label: u.n + " +" + upv(u, lv) + "(Lv " + lv + " / " + UPMAX + ")", note: max ? "最大まで強化済み" : "次のLv:+" + upv(u, lv + 1) + "　憎悪 " + cost,
        alt: true, disabled: max || rec.ash < cost, fn: () => upScreen(u)
      };
    });
    list.push({ label: "戻る", fn: showTitle });
    setChoices(list);
    recordLine();
  }
  function upScreen(u) {
    document.body.className = "title";
    clearLog();
    const lv = rec.up[u.k];
    logHead("憎悪を消費します");
    log(u.n + "を強化する。(いま Lv " + lv + " / " + UPMAX + ")");
    log("効果:+" + upv(u, lv) + " → 次のLvで +" + upv(u, lv + 1), "dice");
    log("消費した憎悪は戻らない。取り消しも、振り直しもできない。", "bad");
    const opts = [];
    const tryN = (n) => {
      n = Math.min(n, UPMAX - lv);
      if (n < 1 || opts.some((o) => o.n === n)) return;
      let c = 0; for (let i = 0; i < n; i++) c += upCost(u, lv + i);
      if (c <= rec.ash) opts.push({ n: n, c: c });
    };
    tryN(1); tryN(5); tryN(10); tryN(25);
    let n = 0, c = 0;
    while (lv + n < UPMAX && c + upCost(u, lv + n) <= rec.ash) { c += upCost(u, lv + n); n++; }
    if (n > 0 && !opts.some((o) => o.n === n)) opts.push({ n: n, c: c, all: true });
    opts.sort((x, y) => x.n - y.n);
    const list = opts.map((o) => ({
      label: (o.all ? "払える限り強化 " : "") + "Lv " + lv + " → " + (lv + o.n),
      note: "効果 +" + upv(u, lv) + " → +" + upv(u, lv + o.n) + "　憎悪 " + o.c + "(いま " + rec.ash + " → " + (rec.ash - o.c) + ")",
      alt: o.n > 1 && !o.all ? true : false,
      fn: () => { rec.ash -= o.c; rec.up[u.k] += o.n; saveRec(); metaScreen(); }
    }));
    list.push({ label: "やめる", alt: true, fn: metaScreen });
    setChoices(list);
    recordLine();
    renderStage();
  }
  function drawStairsIdle() { $("#floorPips").innerHTML = ""; }
  function startRun() {
    clearRun();
    newRun();
    clearLog();
    log("仲間の形見を背負い、最初の拠点へ向かう。");
    render();
    chooseStronghold(0, nextBtn);
  }

  /* テスト用の入口: URL に ?test=1 があるときだけ内部を公開する(通常プレイでは何もしない) */
  if (/[?&]test=1(&|$)/.test(location.search)) {
    window.__RAG = { get G() { return G; }, get enemy() { return enemy; }, T: T, E: E, armDef: armDef, critMin: critMin, makeEnemy: makeEnemy, mod: mod, SKL: SKL };
  }

  titleScreen();
  bootAccount();
})();
</script>
